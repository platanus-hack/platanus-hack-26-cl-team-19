name: PR review bot

# Revisa cada PR hacia dev o main con la API de Claude y deja un solo comentario que se actualiza en
# cada push (JAJ-63). No usa secrets: se autentica con Workload Identity Federation (el token OIDC de
# GitHub se cambia por un token de Anthropic de pocos minutos). Los IDs de abajo no son secretos;
# se crean en la Claude Console (ver docs/bot-reviewer.md). Mientras estén vacíos, el bot avisa y
# termina en verde. Nunca bloquea la PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: write # comentar en la PR
  id-token: write # pedir el token OIDC de GitHub para la federación con Anthropic

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true # si llega otro push, solo se revisa el último

env:
  # Workload Identity Federation de la Claude Console (no son secretos). Regla branchpoint-pr-review:
  # org platanus-hack (189188603), repo platanus-hack-26-cl-team-19, solo el evento pull_request.
  CLAUDE_FEDERATION_RULE_ID: fdrl_01DRTu4Yxe51Y7ZpfQESSZwj
  CLAUDE_ORGANIZATION_ID: e3998e2c-da58-46d5-96a3-a10de2e4a1bf
  CLAUDE_SERVICE_ACCOUNT_ID: svac_015vAv1EDXvYGzoVtLnkgFG5
  CLAUDE_WORKSPACE_ID: wrkspc_01T4w1qeQpDnNwfdgxcdJ9d2

jobs:
  review:
    name: Review with Claude
    # los borradores no se revisan (cuestan tokens); se revisan al marcarlos como listos
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # el diff se calcula contra el ancestro común con la base

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        run: pip install "anthropic==2.12.0"

      # El token de GitHub dura ~5 minutos: se pide justo antes de revisar. Las variables ANTHROPIC_*
      # solo se definen si hay federación configurada (una variable vacía también le gana a las demás).
      - name: Get the GitHub OIDC token for Anthropic
        if: env.CLAUDE_FEDERATION_RULE_ID != ''
        run: |
          token_file="$RUNNER_TEMP/anthropic-oidc.jwt"
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$token_file"
          {
            echo "ANTHROPIC_FEDERATION_RULE_ID=$CLAUDE_FEDERATION_RULE_ID"
            echo "ANTHROPIC_ORGANIZATION_ID=$CLAUDE_ORGANIZATION_ID"
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$token_file"
            if [ -n "$CLAUDE_SERVICE_ACCOUNT_ID" ]; then echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$CLAUDE_SERVICE_ACCOUNT_ID"; fi
            if [ -n "$CLAUDE_WORKSPACE_ID" ]; then echo "ANTHROPIC_WORKSPACE_ID=$CLAUDE_WORKSPACE_ID"; fi
          } >> "$GITHUB_ENV"

      - name: Review the PR
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/pr_review.py
