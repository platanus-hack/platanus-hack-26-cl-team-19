[project]
name = "branchpoint-backend"
version = "0.1.0"
description = "Backend de Branchpoint: motor de simulación, API y, más adelante, persistencia."
requires-python = ">=3.12"
# el motor (app/engine) solo usa la librería estándar; FastAPI y uvicorn son para la API (app/api)
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # lo usa el TestClient de FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
